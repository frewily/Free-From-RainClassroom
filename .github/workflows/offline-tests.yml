name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    env:
      SESSION: ci-test-session
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python offline tests
        run: python -B -m unittest discover -s tests -v

  worker:
    name: Worker (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Worker offline tests
        run: node --test cloudflare/worker.test.mjs
